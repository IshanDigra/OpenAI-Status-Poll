name: OpenAI Status Monitor (Commit-based State)

# Run every 5 minutes
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to commit state.json back to repo
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run status monitor
        env:
          FEED_URL: https://status.openai.com/history.atom
          STATE_BACKEND: file
          STATE_FILE_PATH: state.json
          NOTIFIERS: console,slack
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          LOG_LEVEL: INFO
        run: |
          python -m src.openai_status_monitor --run-once
      
      - name: Commit state back to repository
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add state.json
          git diff --staged --quiet || git commit -m "Update state.json [skip ci]"
          git push
